name: release check

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Release check (release PR against main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/release-check.mjs --base "origin/$BASE_REF"
      - name: Release check (pull request against next)
        if: github.event_name == 'pull_request' && github.base_ref == 'next'
        run: node scripts/release-check.mjs
      - name: Release check (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-check.mjs --tag "$TAG"
      - name: Release check (main)
        if: github.ref == 'refs/heads/main'
        run: node scripts/release-check.mjs
