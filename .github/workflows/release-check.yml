name: release check

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Release check (release PR against main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/release-check.mjs --base "origin/$BASE_REF"
      - name: Release check (pull request against next)
        if: github.event_name == 'pull_request' && github.base_ref == 'next'
        run: node scripts/release-check.mjs
      - name: Release check (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-check.mjs --tag "$TAG"
      - name: Release check (main)
        if: github.ref == 'refs/heads/main'
        run: node scripts/release-check.mjs
      # The shell lists the files, so a branch without tests passes whatever node --test does with no match.
      - name: Tools' tests
        run: |
          shopt -s nullglob
          tests=(tools/*.test.mjs)
          if [ ${#tests[@]} -eq 0 ]; then echo "no tools/*.test.mjs to run"; exit 0; fi
          node --test "${tests[@]}"
      # The same tests with the optional @anthropic-ai/tokenizer installed, as the README suggests (#60). Its whole tree
      # is pinned; tiktoken ships prebuilt WASM. No package.json or lockfile is written, and node_modules/ is ignored.
      - name: Tools' tests (with the tokenizer)
        run: |
          shopt -s nullglob
          tests=(tools/*.test.mjs)
          if [ ${#tests[@]} -eq 0 ]; then echo "no tools/*.test.mjs to run"; exit 0; fi
          npm install --prefix . --no-save --no-package-lock --ignore-scripts --no-audit --no-fund \
            @anthropic-ai/tokenizer@0.0.4 tiktoken@1.0.22 @types/node@18.19.130 undici-types@5.26.5
          npm ls --all --prefix .
          # The tools fall back to chars/4 when the import fails, so check that it loads before the run.
          node --input-type=module -e "const m = await import('@anthropic-ai/tokenizer'); (m.countTokens ?? m.default.countTokens)('hello world')"
          node --test "${tests[@]}"
